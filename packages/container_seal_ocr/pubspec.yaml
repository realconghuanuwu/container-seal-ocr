name: container_seal_ocr
description: Pure Dart & Flutter library for Container Seal OCR recognition with automatic shipping line detection (100% Offline On-Device).
version: 1.0.0
homepage: https://github.com/realconghuanuwu/container-seal-ocr

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.2.0
  onnxruntime: ^1.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  assets:
    - assets/seal_detector.onnx
    - assets/seal_ocr_int8.onnx
    - assets/char_dict.txt
