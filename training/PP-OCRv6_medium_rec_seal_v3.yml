# PP-OCRv6 Medium recipe for the frozen 20,000-crop seal-recognition-v3 dataset.
Global:
  model_name: PP-OCRv6_medium_rec
  use_gpu: true
  seed: 20260919
  epoch_num: 60
  log_smooth_window: 20
  print_batch_step: 25
  save_model_dir: ./training_runs/seal-ocr-rec-v3/checkpoints
  save_epoch_step: 10
  eval_batch_step: [0, 100]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./recognition_dataset_v3
    ext_op_transform_idx: 1
    label_file_list: [./recognition_dataset_v3/train.txt]
    ratio_list: [1.0]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - RecAug:
          tia_prob: 0.10
          crop_prob: 0.0
          reverse_prob: 0.0
          noise_prob: 0.15
          jitter_prob: 0.05
          blur_prob: 0.10
          hsv_aug_prob: 0.15
      - RandomCharacterSpacing: {prob: 0.35, min_segments: 3, max_segments: 6}
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - KeepKeys: {keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]}
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &train_batch 32
    fix_bs: false
    divided_factor: [8, 16]
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: *train_batch
    drop_last: false
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./recognition_dataset_v3
    label_file_list: [./recognition_dataset_v3/val.txt]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - KeepKeys: {keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]}
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
