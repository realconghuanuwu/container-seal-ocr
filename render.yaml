services:
  - type: web
    name: container-seal-ocr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SEAL_DETECTOR_MODEL
        value: models/seal-det-v1.0.0/best.onnx
      - key: RECOGNITION_MODEL_DIR
        value: models/seal-rec-v1.0.4
      - key: MODEL_VERSION
        value: seal-det-v1.0.0-rec-v1.0.4
      - key: PADDLE_PDX_CACHE_HOME
        value: /tmp/paddlex-cache
